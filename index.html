<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Grade 5 English Lab – Super Minds Level 5</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔬</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f8ff;--card:#fff;--ink:#1d2a44;--mute:#5a6785;--line:#d9e2f2;--v:#1f9d55;--vb:#e3f6ea;--g:#2563d6;--gb:#e5eeff;--w:#d9680b;--wb:#fff0df;--ok:#17703d;--okb:#e3f6ea;--no:#9a3412;--nob:#fff1e6;--l:#7c3aed;--lb:#efe7ff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101828;--card:#1a2540;--ink:#eef2fb;--mute:#a9b6d3;--line:#33415f;--v:#4ade80;--vb:#17352a;--g:#7aa7ff;--gb:#1b2d57;--w:#ffa24d;--wb:#41290f;--ok:#7be3a4;--okb:#17352a;--no:#ffb27a;--nob:#41290f;--l:#c4a3ff;--lb:#2e2150}}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:500 18px/1.7 Nunito,"Trebuchet MS",Verdana,sans-serif}
.wrap{max-width:860px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:2rem;line-height:1.2;margin:.2em 0}h2{margin:.2em 0}
.sub{color:var(--mute);margin:0 0 18px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
.mod{border:3px solid;border-radius:20px;padding:18px;background:var(--card);text-align:left;font:inherit;color:inherit;cursor:pointer}
.mod b{display:block;font-size:1.3rem}.mod span{color:var(--mute);font-size:.95rem}.mod .ico{font-size:2rem;display:block}
.mod:focus-visible,button:focus-visible,select:focus-visible,.opt:focus-within{outline:4px solid var(--g);outline-offset:2px}
.c-v{border-color:var(--v)}.c-g{border-color:var(--g)}.c-w{border-color:var(--w)}
.badge{display:inline-block;padding:2px 12px;border-radius:99px;font-weight:800;font-size:.9rem}
.b-v{background:var(--vb);color:var(--v)}.b-g{background:var(--gb);color:var(--g)}.b-w{background:var(--wb);color:var(--w)}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:14px 0}
button.btn,select{font:800 1rem Nunito,Verdana,sans-serif;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--ink);padding:10px 16px;cursor:pointer}
button.pri{background:var(--g);border-color:var(--g);color:#fff}button.pri:disabled{opacity:.45;cursor:not-allowed}
.print{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.q{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:18px;margin:16px 0}
.q .stem{font-size:1.2rem;font-weight:800;margin:8px 0 10px}
.opt{display:flex;gap:10px;align-items:center;border:2px solid var(--line);border-radius:14px;padding:10px 14px;margin:8px 0;cursor:pointer}
.opt input{width:22px;height:22px;accent-color:var(--g)}
.opt.sel{border-color:var(--g);background:var(--gb)}
.fb{border-radius:16px;padding:14px 16px;margin-top:12px;border-left:8px solid}
.fb.ok{background:var(--okb);border-color:var(--ok)}.fb.no{background:var(--nob);border-color:var(--no)}
.fb h3{margin:0 0 4px;font-size:1.15rem}.fb p{margin:6px 0}
.fb .lbl{font-weight:800}
.prog{font-weight:800;color:var(--mute)}
.c-l{border-color:var(--l)}.b-l{background:var(--lb);color:var(--l)}.chips{flex-basis:100%;display:flex;flex-wrap:wrap;gap:8px;align-items:center}.btn.on{background:var(--g);border-color:var(--g);color:#fff}textarea{width:100%;font:inherit;line-height:1.8;border:2px solid var(--line);border-radius:14px;padding:10px;background:var(--bg);color:var(--ink);margin-bottom:10px}
#print{display:none}
@media print{
 body{background:#fff;color:#000;font:16pt/2.2 "Comic Sans MS","Trebuchet MS",Arial,sans-serif}
 .wrap,#app{display:none!important}#print{display:block}
 .pg{page-break-after:always}.pg:last-child{page-break-after:auto}
 .hd{display:flex;justify-content:space-between;gap:20px;border-bottom:2px solid #000;margin-bottom:12px;font-size:13pt}
 .pq{margin:0 0 14pt;break-inside:avoid}.pq .o{display:inline-block;margin-right:22pt}
 .ln{display:inline-block;min-width:150pt;border-bottom:2px solid #000}
 .key{font-size:11pt;line-height:1.5;break-inside:avoid;margin-bottom:10pt;border-bottom:1px dashed #000;padding-bottom:6pt}
 .key p{margin:2pt 0}
}
</style></head>

<script>
const U={1:"The Science Lesson",2:"Disaster!",3:"In the Rainforest",4:"The Rock 'n' Roll Show",5:"Space Restaurant",6:"The Wild West"};
const M={v:{n:"Vocabulary",i:"📗",d:"Words, meanings, synonyms and antonyms",c:"v"},g:{n:"Grammar",i:"📘",d:"Tenses, modals, conditionals, relative clauses",c:"g"},w:{n:"Writing",i:"📙",d:"Sentences, linking words, paragraphs, editing",c:"w"},l:{n:"Listening",i:"🎧",d:"Listen to short texts and answer",c:"l"}};
// m=module u=unit q=stem o=options a=answer index w=why each wrong option is wrong r=rule t=tip
const Q=[
{m:"v",u:1,q:"A scientist does an ___ to find out if an idea is true.",o:["collection","experiment","vitamin"],a:1,w:["A **collection** is a group of things people keep, like stamps. It is not a test.",0,"A **vitamin** is something in food that keeps your body healthy. It is not a test."],r:"An **experiment** is a test that helps you find out if an idea is true.",t:"Scientist + test = experiment."},
{m:"v",u:1,q:"Ice is a solid. When it gets warm, it ___ and becomes water.",o:["freezes","melts","floats"],a:1,w:["**Freezes** is the opposite change: water becomes ice when it is cold.",0,"**Floats** means staying on top of water. Ice floats, but floating does not turn it into water."],r:"**Melt** means to change from solid to liquid because of heat.",t:"Heat → melt. Cold → freeze."},
{m:"v",u:2,q:"A/An ___ is when the ground shakes very hard.",o:["flood","earthquake","storm"],a:1,w:["A **flood** is too much water covering the land. The ground does not shake.",0,"A **storm** is strong wind and rain. The ground does not shake."],r:"An **earthquake** is when the ground moves and shakes suddenly.",t:"Earth + quake (shake) = earthquake."},
{m:"v",u:2,q:"Which word is the OPPOSITE of “safe”?",o:["dangerous","careful","quiet"],a:0,w:[0,"**Careful** means paying attention. It is not the opposite of safe.","**Quiet** is about sound. It has nothing to do with being safe."],r:"**Dangerous** means something can hurt you. It is the opposite (antonym) of **safe**.",t:"Antonyms are opposite words: safe ↔ dangerous."},
{m:"v",u:3,q:"The ___ is the top layer of the rainforest, where branches make a green roof.",o:["canopy","forest floor","river"],a:0,w:[0,"The **forest floor** is the bottom layer, near the ground.","A **river** is flowing water. It is not a layer of trees."],r:"The **canopy** is the high layer of leaves and branches.",t:"Canopy = roof of the forest."},
{m:"v",u:3,q:"Which word means almost the same as “huge”?",o:["tiny","enormous","thin"],a:1,w:["**Tiny** means very small. It is the opposite of huge.",0,"**Thin** means not thick. A thing can be thin and still be big."],r:"**Enormous** and **huge** are synonyms. Both mean very, very big.",t:"Synonyms are words with similar meanings."},
{m:"g",u:1,q:"If you heat ice, it ___.",o:["melted","melts","would melt"],a:1,w:["**Melted** is past tense. This is a science fact that is always true, so we use the present.",0,"**Would melt** is for imaginary situations. Heating ice is real and happens every time."],r:"For facts that are always true, use the **zero conditional**: If + present simple, present simple.",t:"If + present, present = a fact."},
{m:"g",u:1,q:"If it rains tomorrow, we ___ do the experiment inside.",o:["will","would","did"],a:0,w:[0,"**Would** is for imaginary situations. Rain tomorrow is a real possibility, so we need **will**.","**Did** is past tense, but “tomorrow” is in the future."],r:"For real possibilities in the future, use the **first conditional**: If + present simple, will + verb.",t:"Real future possibility = if + present, will."},
{m:"g",u:2,q:"I ___ TV when the earthquake started.",o:["watched","was watching","am watching"],a:1,w:["**Watched** is simple past. It sounds finished. But the watching was in progress when the earthquake interrupted it, so we need past continuous.",0,"**Am watching** is present tense, but the earthquake already happened."],r:"Use **past continuous** (was/were + -ing) for a longer action that was happening when a shorter action interrupted it.",t:"Long action = was watching. Short action = started."},
{m:"g",u:2,q:"You ___ run into a burning building. It is dangerous!",o:["shouldn't","should","could"],a:0,w:[0,"**Should** gives advice to DO something. Here the advice is NOT to do it.","**Could** talks about possibility or past ability. It does not give strong advice."],r:"Use **shouldn't** (should not) to give advice about something that is a bad idea.",t:"should = good idea; shouldn't = bad idea."},
{m:"g",u:3,q:"The jaguar is an animal ___ lives in the rainforest.",o:["who","which","where"],a:1,w:["**Who** is for people, not animals.",0,"**Where** is for places. A jaguar is an animal, not a place."],r:"Use **which** (or **that**) for animals and things. Use **who** for people and **where** for places.",t:"who = people, which = things, where = places."},
{m:"g",u:3,q:"This is the river ___ we saw the crocodile.",o:["where","who","which"],a:0,w:[0,"**Who** is for people. A river is a place.","**Which** is for things. We are talking about a place, so we need **where**."],r:"Use **where** to give more information about a place.",t:"Place word before the gap? Use where."},
{m:"w",u:1,q:"The magnet is small, ___ it is very strong.",o:["because","but","so"],a:1,w:["**Because** gives a reason. Here there is no reason, there is a surprise.",0,"**So** shows a result. Being strong is not a result of being small."],r:"Use **but** to join two ideas that are different or surprising.",t:"but = contrast."},
{m:"w",u:1,q:"Which sentence is written correctly?",o:["we did an experiment yesterday","We did an experiment yesterday.","We did a experiment yesterday."],a:1,w:["It has no **capital letter** at the start and no **full stop** at the end.",0,"We use **an** before a vowel sound. Say “an experiment”, not “a experiment”."],r:"A sentence starts with a **capital letter**, ends with a **full stop**, and uses **a/an** correctly.",t:"Capital at the start, full stop at the end."},
{m:"w",u:2,q:"Which is the best TOPIC SENTENCE for a paragraph about floods?",o:["Floods are dangerous natural disasters.","I like pizza.","The water."],a:0,w:[0,"This sentence is about food, not floods. It does not fit the paragraph.","**The water.** is not a full sentence. It has no verb and does not tell the main idea."],r:"A **topic sentence** is a full sentence that tells the main idea of the paragraph.",t:"First sentence = main idea."},
{m:"w",u:2,q:"First, the ground shook. ___, people ran outside.",o:["Then","Because","But"],a:0,w:[0,"**Because** gives a reason. It does not show what happened next.","**But** shows contrast. The two events are not opposites; one came after the other."],r:"Use order words like **first, then, next, finally** to show what happened in order.",t:"Order words keep your story in order."},
{m:"w",u:3,q:"Edit this sentence: “The monkey are jumping in the trees.”",o:["The monkey is jumping in the trees.","The monkey jump in the trees.","The monkeys is jumping in the trees."],a:0,w:[0,"After **the monkey** (one animal) we need **is jumping**. **Jump** alone does not match the sentence.","**Monkeys** is plural, but **is** is singular. The subject and verb must match."],r:"The verb must **agree** with the subject: one monkey → **is**; many monkeys → **are**.",t:"One = is. Many = are."},
{m:"w",u:3,q:"Which is the best CONCLUDING sentence for a paragraph about rainforest animals?",o:["That is why we must protect the rainforest.","Jaguars have spots.","And then."],a:0,w:[0,"This adds a new fact. A **concluding sentence** should wrap up the paragraph.","**And then.** is not finished. It does not close the idea."],r:"A **concluding sentence** finishes the paragraph and often repeats the main idea in new words.",t:"Last sentence = wrap it up."}
,
{m:`v`,u:1,q:`A ___ is a tool that makes very small things look bigger.`,o:[`microscope`,`telescope`,`thermometer`],a:0,w:[0,`A **telescope** makes faraway things look closer, like the moon.`,`A **thermometer** measures how hot or cold something is.`],r:`A **microscope** helps you see very small things.`,t:`Micro = very small.`},
{m:`v`,u:2,q:`After the flood, the ___ team saved the family.`,o:[`rescue`,`rainbow`,`recipe`],a:0,w:[0,`A **rainbow** is colours in the sky after rain. It is not a team.`,`A **recipe** tells you how to cook food. It does not describe a team.`],r:`**Rescue** means to save someone from danger.`,t:`Rescue = save.`},
{m:`v`,u:3,q:`Which animal lives in the rainforest?`,o:[`toucan`,`penguin`,`camel`],a:0,w:[0,`**Penguins** live in cold places near the sea, not in hot rainforests.`,`**Camels** live in dry deserts, not in wet rainforests.`],r:`A **toucan** is a bird with a big colourful beak that lives in the rainforest.`,t:`Rainforest = hot and wet.`},
{m:`g`,u:1,q:`Water ___ at 100 degrees.`,o:[`boil`,`boils`,`boiling`],a:1,w:[`With **water** (it), present simple needs an **-s**: boils.`,0,`**Boiling** needs **is** before it. For a fact we use present simple.`],r:`Facts use present simple. With he / she / it, add **-s**.`,t:`It + verb + s.`},
{m:`g`,u:2,q:`Yesterday there ___ a big storm.`,o:[`was`,`were`,`is`],a:0,w:[0,`**Were** is for plural things. “A big storm” is one thing, so we use **was**.`,`**Is** is present tense, but “yesterday” tells us it is past.`],r:`Use **was** with singular nouns and **were** with plural nouns in the past.`,t:`One storm = was. Two storms = were.`},
{m:`g`,u:3,q:`You ___ touch the red frog. It is poisonous!`,o:[`mustn't`,`must`,`can`],a:0,w:[0,`**Must** means you have to do it. Touching a poisonous frog is dangerous.`,`**Can** means you are allowed to. Here it is NOT allowed.`],r:`Use **mustn't** for things that are forbidden or very dangerous.`,t:`mustn't = never do it.`},
{m:`w`,u:1,q:`First, we mix the water. ___, we add the salt.`,o:[`Next`,`Because`,`Or`],a:0,w:[0,`**Because** gives a reason. Here we need the next step.`,`**Or** gives a choice. The steps are not choices.`],r:`Use **first, next, then, finally** to write steps in order.`,t:`Steps need order words.`},
{m:`w`,u:2,q:`Which sentence is correct?`,o:[`Run! The flood is coming!`,`run the flood is coming`,`Run the flood is coming?`],a:0,w:[0,`It has no capital letters and no punctuation.`,`It ends with **?**, but it is not a question.`],r:`Use **!** for strong feelings and **?** only for questions.`,t:`Question = ?  Strong feeling = !`},
{m:`w`,u:3,q:`Join the ideas: “Jaguars are fast. Jaguars are strong.”`,o:[`Jaguars are fast and strong.`,`Jaguars are fast because strong.`,`Jaguars fast and strong are.`],a:0,w:[0,`**Because** needs a reason. “Strong” is not a reason for “fast”.`,`The word order is wrong. We need **are** after **Jaguars**.`],r:`Use **and** to join two similar ideas.`,t:`Same kind of idea = and.`},
{m:`l`,u:1,s:`Today in our science lesson, we did an experiment. We put a magnet near some paper clips. The magnet picked up all the clips, but it did not pick up the pencil.`,q:`What did the magnet pick up?`,o:[`the pencil`,`the paper clips`,`the paper`],a:1,w:[`You heard that the magnet did **not** pick up the pencil.`,0,`Paper was never mentioned as picked up.`],r:`Listen for the object after “picked up”. It was the **paper clips**.`,t:`Listen for “but” and “not”.`},
{m:`l`,u:1,s:`Ben put an ice cube in a warm room. After ten minutes, the ice cube was water. Ben wrote: The ice melted because the room was warm.`,q:`Why did the ice melt?`,o:[`The room was warm.`,`The room was dark.`,`Ben was cold.`],a:0,w:[0,`“Dark” was not said.`,`Ben's feelings were not mentioned. The reason was the warm room.`],r:`Listen for **because**. It tells you the reason.`,t:`because + reason.`},
{m:`l`,u:2,s:`Last night there was an earthquake at ten o'clock. Lucy was reading in her bedroom. She quickly went under her desk and waited. Nobody was hurt.`,q:`Where did Lucy go?`,o:[`outside`,`under her desk`,`to the kitchen`],a:1,w:[`Lucy did not go outside.`,0,`The kitchen was not mentioned.`],r:`Lucy went **under her desk** to stay safe.`,t:`Listen for place words: under, in, outside.`},
{m:`l`,u:2,s:`The river rose very fast. The firefighters came in a boat. They saved a dog and two children from a house.`,q:`How many children did the firefighters save?`,o:[`one`,`two`,`three`],a:1,w:[`You heard **two children** and a dog.`,0,`Three counts the dog too, but a dog is not a child.`],r:`They saved **two children** and one dog.`,t:`Listen carefully for numbers and who they describe.`},
{m:`l`,u:3,s:`In the rainforest, it rains almost every day. The canopy is very high, so little light reaches the ground. Many animals live in the trees.`,q:`Why is it dark on the forest floor?`,o:[`The canopy blocks the light.`,`It is always night.`,`There are no plants.`],a:0,w:[0,`Night was not mentioned.`,`Plants were not mentioned as missing. The canopy is the reason.`],r:`Listen for **so**. It shows a result: the canopy is high, so little light reaches the ground.`,t:`so = result.`},
{m:`l`,u:3,s:`Maria saw a green frog on a leaf and a toucan in a tree. The frog was small, but the toucan was big. She took a photo of the toucan.`,q:`What did Maria take a photo of?`,o:[`the frog`,`the toucan`,`the leaf`],a:1,w:[`She saw the frog, but she photographed the toucan.`,0,`The leaf is where the frog sat.`],r:`She took a photo of the **toucan**.`,t:`Seeing something is not the same as photographing it.`}
,
{m:`v`,u:1,q:`Gravity is the force that pulls things ___.`,o:[`down to the ground`,`up into the sky`,`sideways`],a:0,w:[0,`Gravity does not push things up. When you drop a ball, it falls down.`,`Gravity does not pull sideways. It pulls towards the ground.`],r:`**Gravity** pulls things down towards the Earth.`,t:`Drop it and it falls: that is gravity.`},
{m:`v`,u:1,q:`Water, juice and milk are ___.`,o:[`liquids`,`solids`,`gases`],a:0,w:[0,`A **solid** keeps its own shape, like a stone. Water takes the shape of its glass.`,`A **gas**, like air, is usually something you cannot see or pour.`],r:`A **liquid** can flow and pour, like water.`,t:`Solid = hard shape. Liquid = flows. Gas = like air.`},
{m:`v`,u:1,q:`To ___ means to look carefully and notice things.`,o:[`observe`,`ignore`,`forget`],a:0,w:[0,`To **ignore** means NOT to pay attention. It is the opposite.`,`To **forget** means you cannot remember something.`],r:`**Observe** means to look carefully. Scientists observe experiments.`,t:`Scientists observe, then write notes.`},
{m:`v`,u:1,q:`What do you use to find the length of a pencil?`,o:[`ruler`,`thermometer`,`scale`],a:0,w:[0,`A **thermometer** measures how hot or cold something is.`,`A **scale** measures how heavy something is, not how long.`],r:`A **ruler** measures length.`,t:`Length = ruler. Temperature = thermometer. Weight = scale.`},
{m:`v`,u:1,q:`A ___ is a guess about what will happen in an experiment.`,o:[`prediction`,`result`,`question`],a:0,w:[0,`A **result** is what really happened at the end, not a guess before.`,`A **question** asks something. A guess about the future is a prediction.`],r:`A **prediction** is what you think will happen before the experiment.`,t:`Pre = before. Predict first, test next.`},
{m:`v`,u:1,q:`The opposite of “melt” is ___.`,o:[`freeze`,`burn`,`drop`],a:0,w:[0,`To **burn** means to damage something with fire. It is not the opposite of melting.`,`To **drop** means to let something fall. It does not change a liquid into a solid.`],r:`**Freeze** is the opposite of **melt**: liquid becomes solid.`,t:`Melt: solid to liquid. Freeze: liquid to solid.`},
{m:`v`,u:1,q:`Scientists wear safety ___ to protect their eyes.`,o:[`goggles`,`gloves`,`helmets`],a:0,w:[0,`**Gloves** protect your hands, not your eyes.`,`**Helmets** protect your head, not your eyes.`],r:`**Goggles** are special glasses that protect your eyes.`,t:`Eyes = goggles. Hands = gloves.`},
{m:`v`,u:2,q:`A ___ is a mountain that can throw out hot melted rock.`,o:[`volcano`,`valley`,`island`],a:0,w:[0,`A **valley** is low land between hills or mountains.`,`An **island** is land with water all around it.`],r:`A **volcano** is a mountain that can erupt with hot rock and ash.`,t:`Volcano = fire mountain.`},
{m:`v`,u:2,q:`An ___ is a sudden, dangerous situation where you need help quickly.`,o:[`emergency`,`exercise`,`exam`],a:0,w:[0,`An **exercise** is moving your body to stay fit. It is not a danger.`,`An **exam** is a test at school.`],r:`An **emergency** is a dangerous situation where you need help fast.`,t:`Emergency = help now.`},
{m:`v`,u:2,q:`After the storm, people stayed in a ___ until it was safe.`,o:[`shelter`,`ruler`,`recipe`],a:0,w:[0,`A **ruler** is a tool for measuring. It cannot protect people.`,`A **recipe** tells you how to cook. It is not a place.`],r:`A **shelter** is a safe place that protects people from bad weather or danger.`,t:`Shelter = safe place.`},
{m:`v`,u:2,q:`To ___ means to stay alive in a dangerous situation.`,o:[`survive`,`destroy`,`discover`],a:0,w:[0,`To **destroy** means to break something completely.`,`To **discover** means to find something new.`],r:`To **survive** means to stay alive.`,t:`Survive = stay alive.`},
{m:`v`,u:2,q:`The storm caused a lot of ___ to the houses. Many roofs were broken.`,o:[`damage`,`danger`,`dinner`],a:0,w:[0,`**Danger** is the chance that something bad will happen. The roofs are already broken, so we need **damage**.`,`**Dinner** is a meal. It does not fit the sentence.`],r:`**Damage** means harm that is already done to something.`,t:`Damage = already broken.`},
{m:`v`,u:2,q:`The radio gave a ___ that a hurricane was coming. People must leave!`,o:[`warning`,`present`,`joke`],a:0,w:[0,`A **present** is a gift. It does not tell people about danger.`,`A **joke** is something funny. This news is serious.`],r:`A **warning** tells people that danger is coming.`,t:`Warning = be careful!`},
{m:`v`,u:2,q:`Which word means almost the same as “scared”?`,o:[`frightened`,`excited`,`sleepy`],a:0,w:[0,`**Excited** means happy and full of energy.`,`**Sleepy** means you want to sleep.`],r:`**Frightened** and **scared** are synonyms. Both mean afraid.`,t:`Synonyms: scared = frightened.`},
{m:`v`,u:3,q:`An animal that is ___ may disappear forever because there are very few left.`,o:[`endangered`,`enormous`,`energetic`],a:0,w:[0,`**Enormous** means very big.`,`**Energetic** means full of energy.`],r:`An **endangered** animal is in danger of disappearing for ever.`,t:`Endangered = few left.`},
{m:`v`,u:3,q:`It is very ___ in the rainforest. The air is hot and wet.`,o:[`humid`,`frozen`,`dry`],a:0,w:[0,`**Frozen** means very cold, covered in ice.`,`**Dry** means without water. The rainforest is wet.`],r:`**Humid** means the air is warm and full of water.`,t:`Humid = hot and wet.`},
{m:`v`,u:3,q:`A ___ is a long plant that climbs up a tree.`,o:[`vine`,`petal`,`seed`],a:0,w:[0,`A **petal** is a coloured part of a flower.`,`A **seed** is the small thing a new plant grows from.`],r:`A **vine** is a long plant that climbs trees.`,t:`Vines climb.`},
{m:`v`,u:3,q:`We must ___ the rainforest, so animals can live there.`,o:[`protect`,`cut`,`sell`],a:0,w:[0,`To **cut** the trees would take away the animals' homes.`,`To **sell** means to give something for money. It does not keep animals safe.`],r:`To **protect** means to keep something safe.`,t:`Protect = keep safe.`},
{m:`v`,u:3,q:`A frog is an amphibian. A toucan is a ___.`,o:[`bird`,`fish`,`insect`],a:0,w:[0,`A **fish** lives in water and has fins. A toucan can fly.`,`An **insect** is small and has six legs. A toucan has two legs and feathers.`],r:`A **toucan** is a **bird**. It has feathers and a big beak.`,t:`Feathers + beak = bird.`},
{m:`v`,u:3,q:`Which word means almost the same as “quickly”?`,o:[`fast`,`slowly`,`quietly`],a:0,w:[0,`**Slowly** is the opposite of quickly.`,`**Quietly** means without making noise. It is not about speed.`],r:`**Fast** and **quickly** both talk about speed.`,t:`Quickly = fast.`},
{m:`v`,u:3,q:`A big cat with spots that hunts in the rainforest is a ___.`,o:[`jaguar`,`rabbit`,`sheep`],a:0,w:[0,`A **rabbit** is a small animal with long ears. It is not a big cat.`,`A **sheep** gives wool and eats grass. It does not hunt.`],r:`A **jaguar** is a big spotted cat from the rainforest.`,t:`Big cat + spots = jaguar.`}
,
{m:`g`,u:4,q:`Last night, the band ___ a new song.`,o:[`played`,`play`,`plays`],a:0,w:[0,`**Play** is the base form. “Last night” is finished, so we need the past: **played**.`,`**Plays** is present simple. “Last night” tells us it is past.`],r:`Regular verbs make the past simple with **-ed**: play → played.`,t:`Finished time (last night) = past simple.`},
{m:`g`,u:4,q:`We ___ to the rock concert on Saturday.`,o:[`goed`,`went`,`go`],a:1,w:[`**Go** is an irregular verb, so it has no **-ed**. Its past is **went**.`,0,`**Go** is present. The concert is finished, so we need past simple.`],r:`**Irregular** verbs change in the past: go → went, see → saw, eat → ate.`,t:`Learn irregular verbs by heart.`},
{m:`g`,u:4,q:`She ___ sing at the show. She was too shy.`,o:[`didn't sing`,`didn't sang`,`not sing`],a:0,w:[0,`After **didn't** we use the base verb: **sing**, not **sang**.`,`Past negative needs **did + not** (**didn't**) before the verb.`],r:`Past negative: **didn't + base verb**.`,t:`didn't + base verb. The didn't already shows the past.`},
{m:`g`,u:4,q:`My brother ___ like loud music.`,o:[`doesn't`,`don't`,`isn't`],a:0,w:[0,`With **he / she / it** we use **doesn't**, not **don't**.`,`**Isn't** is for the verb **be**. We need **doesn't** with **like**.`],r:`Present negative: **don't** (I, you, we, they) and **doesn't** (he, she, it) + base verb.`,t:`He/she/it → doesn't.`},
{m:`v`,u:4,q:`The ___ clapped and cheered when the band finished.`,o:[`audience`,`stage`,`drum`],a:0,w:[0,`The **stage** is the place where the band stands. It cannot clap.`,`A **drum** is an instrument you hit. It cannot clap.`],r:`The **audience** is the group of people who watch a show.`,t:`Audience = people who watch.`},
{m:`w`,u:4,q:`Which sentence is an OPINION?`,o:[`The concert started at eight o'clock.`,`The band is the best in the world.`,`The guitar has six strings.`],a:1,w:[`You can check a clock, so this is a **fact**.`,0,`You can count the strings, so this is a **fact**.`],r:`A **fact** can be checked. An **opinion** says what someone thinks or feels (best, boring, delicious).`,t:`Words like best, boring, beautiful = opinion.`},
{m:`w`,u:4,q:`Which is the best way to START an email to your friend Sam?`,o:[`Hi Sam,`,`Goodbye Sam`,`Sam, hi, I`],a:0,w:[0,`**Goodbye** is for the end of a message, not the start.`,`The words are in a confusing order. Use **Hi + name + comma**.`],r:`Start an email with **Hi** or **Dear** + the name + a comma.`,t:`Hi Sam, (new line) then your message.`},
{m:`l`,u:4,s:`The rock show started at seven o'clock. Tom played the drums and his sister sang. The audience danced all night. Tom did not play the guitar because it was broken.`,q:`Why didn't Tom play the guitar?`,o:[`It was broken.`,`He was tired.`,`He played the drums.`],a:0,w:[0,`Being tired was not said.`,`He did play the drums, but that is not the reason. Listen for **because**.`],r:`The guitar was broken. **Because** gives the reason.`,t:`because + reason.`},
{m:`g`,u:5,q:`___ you eat pizza yesterday?`,o:[`Did`,`Do`,`Were`],a:0,w:[0,`**Do** is present. “Yesterday” needs past, so we use **did**.`,`**Were** is the past of **be**. With **eat** we need **did**.`],r:`Past simple questions: **Did + subject + base verb?**`,t:`Did you eat? (not Did you ate?)`},
{m:`g`,u:5,q:`___ did the robot cook for dinner?`,o:[`What`,`Who`,`Where`],a:0,w:[0,`**Who** asks about a person. The answer is a food.`,`**Where** asks about a place. The answer is a food.`],r:`Use **What** to ask about things. Use **Who** for people, **Where** for places, **When** for time.`,t:`Think about the answer to choose the wh-word.`},
{m:`g`,u:5,q:`Astronauts ___ wear special suits in space.`,o:[`has to`,`have to`,`had to`],a:1,w:[`**Has to** is for he / she / it. “Astronauts” means they, so we need **have to**.`,0,`**Had to** is past. This sentence is a general rule now.`],r:`**Have to** (I, you, we, they) and **has to** (he, she, it) mean you must do something. **Had to** is the past.`,t:`Present: have to / has to. Past: had to.`},
{m:`g`,u:5,q:`Last week, we ___ clean the space kitchen.`,o:[`had to`,`have to`,`has to`],a:0,w:[0,`**Have to** is present. “Last week” is past.`,`**Has to** is present and for he/she/it.`],r:`Use **had to** for something you must do in the past.`,t:`Last week = had to.`},
{m:`v`,u:5,q:`A/An ___ is a person who travels in a spaceship.`,o:[`astronaut`,`waiter`,`farmer`],a:0,w:[0,`A **waiter** brings food to tables in a restaurant.`,`A **farmer** grows food or keeps animals.`],r:`An **astronaut** travels in space.`,t:`Astro = star or space.`},
{m:`w`,u:5,q:`Which sentence is a FACT?`,o:[`Space pizza is the best food.`,`The Earth goes around the Sun.`,`Space is boring.`],a:1,w:[`**Best** shows a feeling, so this is an **opinion**.`,0,`**Boring** shows a feeling, so this is an **opinion**.`],r:`A **fact** is true and can be checked.`,t:`Can I check it? Then it is a fact.`},
{m:`w`,u:5,q:`Which is the best way to END an email to a friend?`,o:[`Best wishes, Maya`,`The end`,`Dear Maya`],a:0,w:[0,`**The end** is not a friendly way to finish an email.`,`**Dear** is for the start of an email, not the end.`],r:`End an email with **Best wishes**, **Love** or **Your friend**, then your name.`,t:`Closing line, then your name.`},
{m:`l`,u:5,s:`Welcome to the Space Restaurant! Today you can have rice, soup or pizza. The pizza is not ready yet. Please wait ten minutes.`,q:`Which food is NOT ready?`,o:[`pizza`,`rice`,`soup`],a:0,w:[0,`Rice is on the menu, and no problem was mentioned.`,`Soup is on the menu, and no problem was mentioned.`],r:`Listen for **not ready**. It was the **pizza**.`,t:`Listen for not, no, never.`},
{m:`g`,u:6,q:`The cowboy ___ his horse when it started to rain.`,o:[`was riding`,`rode`,`were riding`],a:0,w:[0,`**Rode** is simple past and sounds finished. The riding was in progress when the rain started.`,`**Were** is for plural. “The cowboy” is one person, so use **was**.`],r:`Past continuous: **was / were + -ing** for a longer action in progress in the past.`,t:`Long action = was riding.`},
{m:`g`,u:6,q:`While we ___, the sheriff came into town.`,o:[`were walking`,`was walking`,`walked`],a:0,w:[0,`**Was** is for I/he/she/it. With **we** use **were**.`,`After **while** we usually use past continuous for the longer action.`],r:`Use **were** with we, you, they.`,t:`We/you/they = were.`},
{m:`g`,u:6,q:`They ___ sleeping when the train arrived.`,o:[`weren't`,`wasn't`,`didn't`],a:0,w:[0,`**Wasn't** is for I/he/she/it. “They” needs **weren't**.`,`**Didn't** is used with the base verb, not with **-ing**.`],r:`Past continuous negative: **wasn't / weren't + -ing**.`,t:`-ing verb? Use wasn't/weren't.`},
{m:`g`,u:6,q:`The sheriff ___ look after the town every day.`,o:[`has to`,`have to`,`had to`],a:0,w:[0,`**Have to** is for I/you/we/they. “The sheriff” is he, so use **has to**.`,`**Had to** is past. “Every day” is a habit now.`],r:`Use **has to** with he / she / it.`,t:`He/she/it = has to.`},
{m:`v`,u:6,q:`A ___ is a person who looks after cows and rides a horse.`,o:[`cowboy`,`pilot`,`doctor`],a:0,w:[0,`A **pilot** flies planes.`,`A **doctor** helps sick people.`],r:`A **cowboy** looks after cows and rides horses.`,t:`Cow + boy = cowboy.`},
{m:`w`,u:6,q:`Which sentence is an OPINION?`,o:[`The Wild West was exciting.`,`Cowboys wore hats.`,`Horses have four legs.`],a:0,w:[0,`You can check this with photos, so it is a **fact**.`,`You can count the legs, so it is a **fact**.`],r:`**Exciting** shows a feeling, so it is an **opinion**.`,t:`Feeling words = opinion.`},
{m:`w`,u:6,q:`Choose the best sentence for an email about last weekend.`,o:[`Last weekend I visited a Wild West town and I rode a horse.`,`last weekend i visit town`,`Visit weekend horse.`],a:0,w:[0,`There are no capital letters or full stop, and **visit** should be **visited**.`,`This is not a full sentence. It is missing the subject.`],r:`Write full sentences in the past simple, with capital letters and full stops.`,t:`Last weekend + past simple.`},
{m:`l`,u:6,s:`Yesterday, Jake was riding his horse near the river. He saw a train. The train was carrying gold. Jake waved at the driver and the driver waved back.`,q:`What was the train carrying?`,o:[`gold`,`cows`,`horses`],a:0,w:[0,`Cows were not mentioned.`,`Jake had a horse, but the train was carrying gold.`],r:`The train was carrying **gold**.`,t:`Listen for the word after carrying.`}
];
const W={1:{p:`Write 4-5 sentences about an experiment. What do you need? What do you do first and next? What happens?`,min:35,k:[`experiment`,`first`,`next`,`water`,`ice`,`magnet`,`melt`,`heat`]},2:{p:`Write 4-5 sentences about a disaster (earthquake, flood or storm). What happened? How did people stay safe?`,min:35,k:[`earthquake`,`flood`,`storm`,`safe`,`rescue`,`dangerous`,`shaking`,`help`]},3:{p:`Write 4-5 sentences about the rainforest. Describe two animals or plants and say where they live.`,min:35,k:[`rainforest`,`canopy`,`jaguar`,`toucan`,`frog`,`tree`,`hot`,`wet`]},4:{p:`Write an email to a friend about a concert or show. Line 1: greeting (Hi Sam,). Then 3-4 sentences about the show. Then a closing line (Best wishes,). Last line: your name.`,min:40,e:1,k:[`concert`,`band`,`song`,`music`,`stage`,`audience`,`played`,`danced`]},5:{p:`Write an email to a friend about a meal at the Space Restaurant. Line 1: greeting. Then 3-4 sentences (what you ate, what you had to do). Then a closing line. Last line: your name.`,min:40,e:1,k:[`space`,`food`,`ate`,`pizza`,`robot`,`astronaut`,`had to`,`restaurant`]},6:{p:`Write an email to a friend about a day in the Wild West. Line 1: greeting. Then 3-4 sentences (what you saw, what you were doing). Then a closing line. Last line: your name.`,min:40,e:1,k:[`cowboy`,`horse`,`sheriff`,`train`,`gold`,`riding`,`had to`,`town`]}};
const st={mod:null,unit:0,n:10,set:[],wr:{},wd:{},ans:{}};
const $=s=>document.querySelector(s);
const md=s=>String(s).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>");
const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const pool=()=>Q.map((q,i)=>({...q,id:i})).filter(q=>q.m===st.mod&&(!st.unit||q.u===st.unit));
const deal=()=>{const p=pool();for(let i=p.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[p[i],p[j]]=[p[j],p[i]]}st.set=p.slice(0,st.n)};
const list=()=>st.set;
const say=t=>{try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-GB';u.rate=.85;speechSynthesis.speak(u)}catch(e){}};
const wcheck=(t,u)=>{const w=W[u],n=t.trim().split(/\s+/).filter(Boolean).length,s=((w.e?t.split('\n').slice(1,-2).join(' '):t).match(/[^.!?]+[.!?]*/g)||[]).map(x=>x.trim()).filter(Boolean),hit=w.k.filter(k=>t.toLowerCase().includes(k));return[...(w.e?[[/^(dear|hi|hello)\b/i.test(t.trim())&&/(best wishes|love|your friend|see you|bye)/i.test(t),'Line 1: Hi or Dear + name. Then the body. Then a closing (Best wishes, Love, Your friend) and your name.']]:[]),[n>=w.min,`Write at least ${w.min} words (you wrote ${n}).`],[s.length>0&&s.every(x=>/^[A-Z]/.test(x)),'Start every sentence with a capital letter.'],[s.length>0&&s.every(x=>/[.!?]$/.test(x)),'End every sentence with . ! or ?'],[!/\bi\b/.test(t),'Write I with a capital letter.'],[/\b(and|but|because|so|then|first|next)\b/i.test(t),'Use a linking word: and, but, because, so, then.'],[hit.length>=3,`Use at least 3 unit words (${w.k.join(', ')}). You used ${hit.length}.`]]};
const wHTML=()=>st.mod!=='w'?'':Object.keys(U).filter(u=>!st.unit||+u===st.unit).map(u=>{const t=st.wr[u]||'',c=st.wd[u]?wcheck(t,u):null,ok=c&&c.every(x=>x[0]);return `<section class="q"><span class="badge b-w">Writing task</span> <span class="prog">Unit ${u}: ${U[u]}</span><div class="stem">${W[u].p}</div><textarea id="wt${u}" rows="7" placeholder="Write here...">${esc(t)}</textarea><button class="btn pri" data-w="${u}">Check my writing</button>${c?`<div class="fb ${ok?'ok':'no'}" role="status"><h3>${ok?'🌟 Excellent! You passed every check.':'💪 Almost there. Fix the ❌ and check again.'}</h3>${c.map(x=>`<p>${x[0]?'✅':'❌'} ${x[1]}</p>`).join('')}</div>`:''}</section>`}).join('');
const wPrint=()=>Object.keys(U).filter(u=>!st.unit||+u===st.unit).map(u=>`<div class="pq"><b>Writing – Unit ${u}:</b> ${W[u].p}${'<div class="ln" style="display:block;height:1.8em"></div>'.repeat(7)}</div>`).join('');
function home(){
 st.mod=null;
 $("#app").innerHTML=`<h1>🔬 English Lab</h1><p class="sub">Super Minds Level 5 · Pick a skill to practise. Every answer comes with an explanation.</p>
 <div class="cards">${Object.entries(M).map(([k,m])=>`<button class="mod c-${m.c}" data-m="${k}"><span class="ico">${m.i}</span><b>${m.n}</b><span>${m.d}</span></button>`).join("")}</div>`;
 document.querySelectorAll(".mod").forEach(b=>b.onclick=()=>{st.mod=b.dataset.m;st.unit=0;deal();page()});
}
function page(){
 const m=M[st.mod],L=list(),done=L.filter(q=>st.ans[q.id]!==undefined&&st.ans[q.id].done).length,right=L.filter(q=>st.ans[q.id]&&st.ans[q.id].done&&st.ans[q.id].pick===q.a).length;
 $("#app").innerHTML=`<button class="btn" id="back">← All skills</button>
 <h1>${m.i} ${m.n} <span class="badge b-${m.c}">${m.n}</span></h1>
 <div class="bar"><div class="chips"><b>Unit:</b>${[[0,'All units'],...Object.entries(U).map(([k,v])=>[k,`Unit ${k}: ${v}`])].map(([k,v])=>`<button class="btn ${+k===st.unit?'on':''}" data-u="${k}">${v}</button>`).join('')}</div><div class="chips"><b>How many questions?</b>${[5,10,15,20,30].map(n=>`<button class="btn ${n===st.n?'on':''}" data-n="${n}">${n}</button>`).join('')}</div>
 <button class="btn print" id="pr">🖨️ Export / Print Worksheet</button><button class="btn" id="rs">Start again</button></div>
 <p class="prog">Showing ${L.length} of ${pool().length} available · Answered ${done} · Correct ${right}</p>
 ${L.map((q,n)=>qHTML(q,n)).join('')}${wHTML()}`;
 $('#back').onclick=home;
 document.querySelectorAll('[data-u]').forEach(b=>b.onclick=()=>{st.unit=+b.dataset.u;deal();page()});
 document.querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>{st.n=+b.dataset.n;deal();page()});
 document.querySelectorAll('[data-say]').forEach(b=>b.onclick=()=>say(Q[b.dataset.say].s));
 document.querySelectorAll('textarea').forEach(a=>a.oninput=()=>{st.wr[a.id.slice(2)]=a.value});
 document.querySelectorAll('[data-w]').forEach(b=>b.onclick=()=>{const u=b.dataset.w;st.wr[u]=$('#wt'+u).value;st.wd[u]=true;page()});
 $("#pr").onclick=()=>{buildPrint(L);window.print()};
 $('#rs').onclick=()=>{L.forEach(q=>delete st.ans[q.id]);deal();page()};
 L.forEach(q=>{
  const box=$("#q"+q.id);
  const cb=$("#c"+q.id);
  if(!cb)return;
  box.querySelectorAll("input").forEach(r=>r.onchange=()=>{st.ans[q.id]={pick:+r.value,done:false};box.querySelectorAll(".opt").forEach(o=>o.classList.remove("sel"));r.closest(".opt").classList.add("sel");cb.disabled=false});
  cb.onclick=()=>{if(!st.ans[q.id])return;st.ans[q.id].done=true;page();const e=$("#q"+q.id);e&&e.scrollIntoView({block:"nearest"})};
 });
}
function qHTML(q,n){
 const a=st.ans[q.id],done=a&&a.done,c=M[q.m].c;
 let fb="";
 if(done){
  const ok=a.pick===q.a;
  fb=ok?`<div class="fb ok" role="status"><h3>🌟 Great job! That is correct.</h3><p><span class="lbl">Why it works:</span> ${md(q.r)}</p><p><span class="lbl">Remember:</span> ${md(q.t)}</p></div>`
  :`<div class="fb no" role="status"><h3>💪 Not quite, but you are learning!</h3><p><span class="lbl">What went wrong:</span> You chose <b>“${esc(q.o[a.pick])}”</b>. ${md(q.w[a.pick])}</p><p><span class="lbl">Correct answer:</span> <b>“${esc(q.o[q.a])}”</b>. ${md(q.r)}</p><p><span class="lbl">Remember:</span> ${md(q.t)}</p></div>`;
 }
 return `<section class="q" id="q${q.id}"><span class="badge b-${c}">${M[q.m].n}</span> <span class="prog">Unit ${q.u}: ${U[q.u]}</span>
 ${q.s?`<button class="btn" data-say="${q.id}">🔊 Listen (play as many times as you need)</button>`:''}<div class="stem">${n+1}. ${esc(q.q)}</div>${done&&q.s?`<p class="prog">📝 Script: ${esc(q.s)}</p>`:''}
 ${q.o.map((o,i)=>`<label class="opt ${a&&a.pick===i?"sel":""}"><input type="radio" name="r${q.id}" value="${i}" ${a&&a.pick===i?"checked":""} ${done?"disabled":""}> ${esc(o)}</label>`).join("")}
 ${done?"":`<button class="btn pri" id="c${q.id}" ${a?"":"disabled"}>Check my answer</button>`}${fb}</section>`;
}
function buildPrint(L){
 const m=M[st.mod],t=st.unit?`Unit ${st.unit}: ${U[st.unit]}`:"All units",L2="abc";
 const hd=x=>`<div class="hd"><span>Name: ______________________</span><span>Date: ____________</span><span>Class: ________</span></div><h2>${m.n} Worksheet – ${t}</h2><p style="font-size:12pt;line-height:1.4;margin:0 0 10pt">${x}</p>`;
 const ex=L.map((q,n)=>`<div class="pq">${n+1}. ${q.s?'🎧 ':''}${esc(q.q).replace("___",'<span class="ln"></span>')}<br>${q.o.map((o,i)=>`<span class="o">${L2[i]}) ${esc(o)}</span>`).join("")}${q.q.includes("___")?"":'<br>Answer: <span class="ln"></span>'}</div>`).join("");
 const key=L.map((q,n)=>`<div class="key"><b>${n+1}. Correct: ${L2[q.a]}) ${esc(q.o[q.a])}</b>${q.s?`<p>🎧 Teacher reads: ${esc(q.s)}</p>`:''}<p>✔ Why: ${md(q.r)}</p>${q.o.map((o,i)=>i===q.a?"":`<p>✘ ${L2[i]}) ${esc(o)}: ${md(q.w[i])}</p>`).join("")}<p>Tip: ${md(q.t)}</p></div>`).join("");
 $("#print").innerHTML=`<div class="pg">${hd("Circle the best answer, or write it on the line.")}${ex}${st.mod==='w'?wPrint():''}</div><div class="pg">${hd("Answer &amp; Explanation Key (for checking)")}${key}</div>`;
}
home();
</script></body></html>
